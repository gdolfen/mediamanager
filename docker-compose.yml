services:
  mediamanager:
    build:
      context: .
      args:
        VERSION: "1.0.2"
    container_name: mediamanager
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATA_DIR=/data
      - UPLOAD_DIR=/upload
      - FOTOS_DIR=/fotos
      - VIDEOS_DIR=/videos
    volumes:
      - //P/:/upload:ro
      - //Y/:/fotos
      - //V/:/videos
      - ./lokal/data:/data